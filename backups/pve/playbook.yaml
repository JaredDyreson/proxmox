---
- name: Deploy kuma-backup-checker on a Proxmox node
  hosts: proxmox
  become: true
  gather_facts: true

  vars:
    app_name: kuma-backup-checker
    app_dir: /opt/kuma-backup-checker
    workspace_dir: "{{ playbook_dir }}/../../services"
    binary_src: "{{ workspace_dir }}/target/release/kuma-backup-checker"
    systemd_unit_src: "{{ playbook_dir }}/../kuma-backup-checker.service"

  tasks:
    - name: Build release binary
      ansible.builtin.command:
        cmd: cargo build --release -p kuma-backup-checker
        chdir: "{{ workspace_dir }}"
      delegate_to: localhost
      become: false
      run_once: true
      register: build_result
      changed_when: "'Compiling kuma-backup-checker' in build_result.stderr"

    - name: Create application directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Copy release binary
      ansible.builtin.copy:
        src: "{{ binary_src }}"
        dest: "{{ app_dir }}/{{ app_name }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart kuma-backup-checker

    - name: Install systemd unit
      ansible.builtin.copy:
        src: "{{ systemd_unit_src }}"
        dest: /etc/systemd/system/kuma-backup-checker.service
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart kuma-backup-checker

    - name: Enable and start kuma-backup-checker
      ansible.builtin.systemd:
        name: kuma-backup-checker
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Restart kuma-backup-checker
      ansible.builtin.systemd:
        name: kuma-backup-checker
        state: restarted
