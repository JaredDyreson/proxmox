[workspace]
resolver = "3"
members = ["kuma-relay", "kuma-filter", "kuma-backup-checker", "logtail"]

[workspace.dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
fern = "0.7.1"
log = "0.4.29"
reqwest = { version = "0.13.3", features = ["json", "multipart"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["full"] }

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
